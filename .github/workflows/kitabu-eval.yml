name: WeKaribu — accuracy check (on-device models + FLORES-200)

# Runs the app's own topic, sentiment and translation code on a labeled synthetic set and on the
# published FLORES-200 benchmark, then commits the results (shown on /kitabu/eval.html).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kitabu/src/ai.js'
      - 'kitabu/src/topics.js'
      - 'kitabu/src/pipeline.js'
      - 'kitabu/src/evalcore.js'
      - 'kitabu/src/langs.js'
      - 'kitabu/public/data/eval-set.json'
      - 'kitabu/tools/eval.mjs'
      - '.github/workflows/kitabu-eval.yml'

permissions:
  contents: write

concurrency:
  group: kitabu-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kitabu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (app build tools + the same AI library version as the app)
        run: npm ci --no-audit --no-fund && npm install --no-save --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Cache models and benchmark data
        uses: actions/cache@v4
        with:
          path: kitabu/.cache
          key: kitabu-eval-cache-v1-${{ github.run_id }}
          restore-keys: kitabu-eval-cache-v1-
      - name: Run accuracy check
        run: node tools/eval.mjs
      - name: Rebuild the static app
        run: npm run site
      - name: Commit results
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kitabu/public/data/eval-results.json public/kitabu
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "WeKaribu: update accuracy check results"
          git pull --rebase origin main
          git push origin HEAD:main
