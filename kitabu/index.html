<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitabu cha Wageni</title>
  <meta name="description" content="Offline guestbook and feedback assistant for a small coffee-farm tour operator. Swahili first.">
  <meta name="theme-color" content="#24533F">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/src/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="32" height="32">
      <div class="brand-name">Kitabu cha Wageni</div>
    </div>
    <div class="topbar-actions host-only">
      <span id="net" class="net" aria-live="polite"></span>
      <button class="icon-btn" id="lang-btn" data-action="toggle-lang" aria-label="Kiswahili / English">English</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Tafadhali washa JavaScript. Please enable JavaScript.</noscript>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
