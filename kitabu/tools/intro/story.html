<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WeKaribu story scenes</title>
<style>
  html, body { margin: 0; background: #1E130C; width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; width: 1920px; height: 1080px; }
  text { font-family: "Noto Sans", "Inter", system-ui, sans-serif; }
</style>
</head>
<body>
<!-- Cartoon scenes for the demo video, drawn with plain SVG shapes in the Korla style. All characters are
     invented. window.setScene(id) builds a scene; window.seek(t) places everything for time t within it;
     window.SCENES lists ids and durations. Rendered frame by frame by render_scenes.mjs. -->
<div id="stage"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---------- palette ----------
const C = { ink: '#2B1D14', cream: '#F6EFE6', brown: '#5B3A24', latte: '#EFE2D3', cherry: '#A33F2A', leaf: '#5E8A4A', leaf2: '#8FAE6E', sky: '#F3D9B8', sun: '#E2A85C', grey: '#9AA0A8' };

// ---------- characters ----------
// A simple person: head, body, two arms. Options: skin, hair (color), style ('short'|'long'|'braids'|'scarf'|'cap'|'hat'), shirt, beard.
function person(id, o) {
  const skin = o.skin, hair = o.hair || '#2B1D14', shirt = o.shirt || '#5B3A24';
  let top = '';
  if (o.style === 'short') top = `<path d="M-52 -30 q 52 -70 104 0 v -10 q -52 -60 -104 0z" fill="${hair}"/><path d="M-54 -28 q 54 -75 108 0 q -8 -40 -54 -48 q -46 8 -54 48z" fill="${hair}"/>`;
  if (o.style === 'long') top = `<path d="M-56 -20 q 56 -90 112 0 l 14 110 q -70 20 -140 0z" fill="${hair}"/>`;
  if (o.style === 'braids') top = `<path d="M-54 -26 q 54 -78 108 0 q -8 -36 -54 -44 q -46 8 -54 44z" fill="${hair}"/><path d="M-60 -10 c -20 40 -10 90 0 120 M60 -10 c 20 40 10 90 0 120" fill="none" stroke="${hair}" stroke-width="16" stroke-linecap="round"/><circle cx="-60" cy="110" r="10" fill="${C.cherry}"/><circle cx="60" cy="110" r="10" fill="${C.cherry}"/>`;
  if (o.style === 'scarf') top = `<path d="M-62 -14 q 62 -92 124 0 l 10 40 q -72 -30 -144 0z" fill="${o.scarf || C.cherry}"/><path d="M-62 -14 q 62 -92 124 0" fill="none" stroke="${C.sun}" stroke-width="6" stroke-dasharray="10 8"/><path d="M50 10 q 40 40 20 110" fill="none" stroke="${o.scarf || C.cherry}" stroke-width="22" stroke-linecap="round"/>`;
  if (o.style === 'cap') top = `<path d="M-54 -26 q 54 -70 108 0z" fill="${o.cap || '#2F5A78'}"/><path d="M-60 -24 h 150 a 8 8 0 0 1 0 16 h -150z" fill="${o.cap || '#2F5A78'}"/>`;
  if (o.style === 'hat') top = `<path d="M-50 -30 q 50 -60 100 0z" fill="${o.hat || '#D9C7A0'}"/><ellipse cx="0" cy="-30" rx="96" ry="18" fill="${o.hat || '#D9C7A0'}"/><rect x="-50" y="-44" width="100" height="14" fill="${C.cherry}"/>`;
  const beard = o.beard ? `<path d="M-40 24 q 40 70 80 0 q -10 50 -40 54 q -30 -4 -40 -54z" fill="${o.beard}"/>` : '';
  const glasses = o.glasses ? `<g fill="none" stroke="${C.ink}" stroke-width="4"><circle cx="-24" cy="-4" r="16"/><circle cx="24" cy="-4" r="16"/><path d="M-8 -4h16"/></g>` : '';
  return `
  <g id="${id}" class="person">
    <g id="${id}-body">
      <path d="M-70 120 q 70 -50 140 0 v 150 h -140z" fill="${shirt}"/>
      <g id="${id}-armL" transform="translate(-62 150)"><rect x="-16" y="0" width="32" height="120" rx="16" fill="${shirt}"/><circle cx="0" cy="124" r="18" fill="${skin}"/></g>
      <g id="${id}-armR" transform="translate(62 150)"><rect x="-16" y="0" width="32" height="120" rx="16" fill="${shirt}"/><circle cx="0" cy="124" r="18" fill="${skin}"/></g>
    </g>
    <g id="${id}-head">
      <rect x="-18" y="70" width="36" height="50" fill="${skin}"/>
      <circle r="62" fill="${skin}"/>
      ${top}
      <g id="${id}-eyes"><circle cx="-22" cy="-4" r="7" fill="${C.ink}"/><circle cx="22" cy="-4" r="7" fill="${C.ink}"/></g>
      ${glasses}
      <ellipse id="${id}-mouth" cx="0" cy="30" rx="12" ry="4" fill="${C.ink}"/>
      <circle cx="-38" cy="18" r="8" fill="#E9A6A6" opacity="0.5"/><circle cx="38" cy="18" r="8" fill="#E9A6A6" opacity="0.5"/>
      ${beard}
    </g>
  </g>`;
}

// speech bubble with wrapped text
function bubble(id, x, y, w, lines, tail = 'left') {
  const lh = 42, pad = 22, hgt = lines.length * lh + pad * 2;
  const tailPath = tail === 'left' ? `M${x + 50} ${y + hgt} l -20 40 l 50 -40z` : `M${x + w - 50} ${y + hgt} l 20 40 l -50 -40z`;
  return `<g id="${id}" opacity="0">
    <path d="${tailPath}" fill="#fff"/>
    <rect x="${x}" y="${y}" width="${w}" height="${hgt}" rx="22" fill="#fff"/>
    ${lines.map((l, i) => `<text x="${x + pad}" y="${y + pad + lh * (i + 0.78)}" font-size="34" fill="${C.ink}">${esc(l)}</text>`).join('')}
  </g>`;
}

function phoneSvg(id, x, y, w = 150, h = 290, screen = '') {
  return `<g id="${id}" transform="translate(${x} ${y})"><rect x="0" y="0" width="${w}" height="${h}" rx="22" fill="#1A1412"/><rect x="8" y="10" width="${w - 16}" height="${h - 20}" rx="14" fill="#F6EFE6"/><rect x="8" y="10" width="${w - 16}" height="34" rx="14" fill="${C.brown}"/><text x="${w / 2}" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">WeKaribu</text>${screen}</g>`;
}

function basicPhone(id, x, y) {
  return `<g id="${id}" transform="translate(${x} ${y})"><rect x="0" y="0" width="90" height="200" rx="16" fill="#2B2B2B"/><rect x="10" y="12" width="70" height="60" rx="6" fill="#9CC79A"/><g fill="#555">${[0, 1, 2, 3].map(r => [0, 1, 2].map(c => `<rect x="${12 + c * 24}" y="${88 + r * 26}" width="18" height="16" rx="3"/>`).join('')).join('')}</g><text id="${id}-txt" x="45" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A1E"></text></g>`;
}

const mountain = `<path d="M1200 620 L1500 300 L1800 620z" fill="#8C7B6B"/><path d="M1400 400 L1500 300 L1600 400 L1560 410 L1500 360 L1440 410z" fill="#F6EFE6"/><path d="M1000 640 L1250 420 L1500 640z" fill="#6E5F52"/>`;
const hills = `<path d="M0 760 C 300 640 600 660 960 740 S 1600 700 1920 760 V1080 H0 Z" fill="${C.leaf2}"/><path d="M0 860 C 400 780 800 820 1200 880 S 1700 860 1920 900 V1080 H0 Z" fill="${C.leaf}"/>`;
function bush(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="70" ry="60" fill="#4F7A3C"/><ellipse cx="-40" cy="10" rx="40" ry="34" fill="#5E8A4A"/><ellipse cx="40" cy="14" rx="44" ry="36" fill="#5E8A4A"/><circle cx="-20" cy="-10" r="8" fill="${C.cherry}"/><circle cx="24" cy="-22" r="8" fill="${C.cherry}"/><circle cx="4" cy="20" r="8" fill="#C9553C"/><circle cx="-44" cy="26" r="7" fill="${C.cherry}"/><circle cx="48" cy="30" r="7" fill="#C9553C"/></g>`;
}
const sun = (x, y) => `<circle cx="${x}" cy="${y}" r="70" fill="${C.sun}"/>`;
const title = (t, sub) => `<g id="caption"><rect x="0" y="960" width="1920" height="120" fill="rgba(43,29,20,.78)"/><text x="60" y="1012" font-size="40" font-weight="800" fill="${C.cream}">${esc(t)}</text><text x="60" y="1056" font-size="28" fill="#DECCB8">${esc(sub || '')}</text></g>`;

// ---------- scenes ----------
const SCENES = {
  kitchen: {
    duration: 9,
    build: () => `
      <rect width="1920" height="1080" fill="#F3E6D3"/>
      <rect x="1180" y="120" width="520" height="380" rx="18" fill="#BFE0F5" stroke="#8C6B4F" stroke-width="16"/>
      <path d="M1180 310 h520 M1440 120 v380" stroke="#8C6B4F" stroke-width="12"/>
      ${sun(1600, 220)}
      <path d="M1180 420 C 1300 360 1420 380 1700 430 V500 H1180z" fill="#7FB6E0"/>
      <rect x="0" y="700" width="1920" height="380" fill="#D9B48B"/>
      <rect x="200" y="620" width="1500" height="40" rx="10" fill="#8C6B4F"/>
      <rect x="260" y="660" width="40" height="300" fill="#8C6B4F"/><rect x="1600" y="660" width="40" height="300" fill="#8C6B4F"/>
      <!-- cups -->
      <g transform="translate(560 560)"><rect x="0" y="0" width="70" height="60" rx="10" fill="#fff"/><path d="M70 15 c 30 0 30 35 0 35" fill="none" stroke="#fff" stroke-width="10"/></g>
      <g transform="translate(1180 560)"><rect x="0" y="0" width="70" height="60" rx="10" fill="#fff"/><path d="M70 15 c 30 0 30 35 0 35" fill="none" stroke="#fff" stroke-width="10"/></g>
      <g id="vivianG" transform="translate(420 420)">${person('vivian', { skin: '#F1C9A5', hair: '#B5651D', style: 'long', shirt: '#2F7A8A' })}</g>
      <g id="frankG" transform="translate(760 430)">${person('frank', { skin: '#E8B88E', hair: '#5A3A1E', style: 'short', shirt: '#A33F2A', beard: '#5A3A1E', glasses: true })}</g>
      <g id="emmaG" transform="translate(1340 430)">${person('emma', { skin: '#D9A066', hair: '#2B1D14', style: 'braids', shirt: '#E2A85C' })}</g>
      ${phoneSvg('emmaPhone', 1230, 560, 120, 220, `<rect x="16" y="56" width="88" height="60" rx="6" fill="#8FAE6E"/><circle cx="60" cy="86" r="12" fill="#E2A85C"/><rect x="16" y="126" width="88" height="10" rx="4" fill="#C9B8A4"/><rect x="16" y="146" width="60" height="10" rx="4" fill="#C9B8A4"/>`)}
      ${bubble('b1', 820, 150, 640, ['Noor’s coffee farm, in Materuni.', 'No website, no internet…', 'you can only go by luck!'], 'right')}
      ${title('Melbourne, Australia', 'Vivian and Frank are planning a trip to Tanzania. Their friend Emma went last month.')}`,
    seek: t => {
      bob('vivian', t); bob('frank', t, 0.4); bob('emma', t, 0.8);
      talk('emma', t >= 1.2 && t < 7.5, t);
      show('b1', t, 1.0);
      nod('vivian', t, 4.5); nod('frank', t, 5.2);
    },
  },
  phone: {
    duration: 5,
    build: () => `
      <rect width="1920" height="1080" fill="#F3E6D3"/>
      <rect x="0" y="700" width="1920" height="380" fill="#D9B48B"/>
      <g id="vivianG" transform="translate(620 420)">${person('vivian', { skin: '#F1C9A5', hair: '#B5651D', style: 'long', shirt: '#2F7A8A' })}</g>
      <g id="bigPhone" transform="translate(1050 240)">${phoneSvg('p2', 0, 0, 300, 580, `<text x="150" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="${C.ink}">Who are you?</text><g transform="translate(24 180)"><rect width="252" height="70" rx="14" fill="#fff" stroke="#E3D6C8"/><rect x="12" y="12" width="46" height="46" rx="12" fill="#F5DEB8"/><text x="72" y="44" font-size="22" font-weight="700" fill="${C.ink}">Host</text></g><g id="visitorCard" transform="translate(24 266)"><rect width="252" height="70" rx="14" fill="#fff" stroke="#E3D6C8"/><rect x="12" y="12" width="46" height="46" rx="12" fill="#DCE8CF"/><text x="72" y="44" font-size="22" font-weight="700" fill="${C.ink}">Visitor</text></g><g transform="translate(24 352)"><rect width="252" height="70" rx="14" fill="#fff" stroke="#E3D6C8"/><rect x="12" y="12" width="46" height="46" rx="12" fill="#D9E6EF"/><text x="72" y="44" font-size="22" font-weight="700" fill="${C.ink}">Tour company</text></g>`)}</g>
      <g id="finger" opacity="0"><circle cx="1230" cy="560" r="26" fill="#F1C9A5" stroke="#C9A27E" stroke-width="4"/></g>
      ${bubble('b1', 300, 150, 560, ['Emma left her feedback', 'through WeKaribu.', 'Let’s open it.'], 'left')}
      ${title('Vivian opens WeKaribu', 'The visitor side: find a place, see when the host is free, book.')}`,
    seek: t => {
      bob('vivian', t); talk('vivian', t >= 0.6 && t < 3.6, t); show('b1', t, 0.5);
      const f = clamp((t - 3.2) / 0.6);
      $('finger').setAttribute('opacity', t > 3.0 ? 1 : 0);
      $('finger').setAttribute('transform', `translate(${lerp(120, 0, ease(f))} ${lerp(140, 0, ease(f))})`);
      const pressed = t > 3.9;
      $('visitorCard').setAttribute('transform', `translate(24 266) ${pressed ? 'scale(0.97)' : ''}`);
      $('visitorCard').querySelector('rect').setAttribute('fill', pressed ? '#EFE2D3' : '#fff');
    },
  },
  office: {
    duration: 8,
    build: () => `
      <rect width="1920" height="1080" fill="#EAE3D6"/>
      <rect x="0" y="720" width="1920" height="360" fill="#C9B8A4"/>
      <rect x="120" y="120" width="700" height="90" rx="12" fill="${C.brown}"/><text x="470" y="182" text-anchor="middle" font-size="44" font-weight="800" fill="${C.cream}">Ondera Coffee Trails</text>
      <rect x="300" y="620" width="1300" height="40" rx="8" fill="#8C6B4F"/><rect x="340" y="660" width="36" height="300" fill="#8C6B4F"/><rect x="1520" y="660" width="36" height="300" fill="#8C6B4F"/>
      <g id="jumaG" transform="translate(620 400)">${person('juma', { skin: '#8D5A3C', hair: '#1A1412', style: 'cap', shirt: '#2F5A78', cap: '#E2A85C' })}</g>
      <!-- laptop -->
      <g transform="translate(900 430)"><rect x="0" y="0" width="420" height="200" rx="12" fill="#2B2B2B"/><rect x="14" y="14" width="392" height="172" rx="6" fill="#F6EFE6"/><rect x="-20" y="200" width="460" height="18" rx="6" fill="#444"/>
        <rect x="14" y="14" width="392" height="30" fill="${C.brown}"/><text x="30" y="36" font-size="18" font-weight="700" fill="#fff">WeKaribu · Tour company</text>
        <g id="req" opacity="0"><rect x="30" y="58" width="360" height="110" rx="10" fill="#FFF1CC" stroke="#E2A85C" stroke-width="3"/>
          <text x="46" y="88" font-size="20" font-weight="700" fill="${C.ink}">New request: Vivian &amp; Frank</text>
          <text x="46" y="114" font-size="18" fill="${C.ink}">Saturday · 2 guests · English · via Emma</text>
          <g id="confirmBtn"><rect x="46" y="126" width="200" height="32" rx="8" fill="${C.brown}"/><text x="146" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Confirm → SMS to Noor</text></g></g>
      </g>
      <g id="sms" opacity="0"><rect x="0" y="0" width="150" height="100" rx="14" fill="#fff" stroke="${C.brown}" stroke-width="5"/><path d="M0 0 l75 60 l75 -60" fill="none" stroke="${C.brown}" stroke-width="5"/><text x="75" y="130" text-anchor="middle" font-size="26" font-weight="800" fill="${C.brown}">SMS</text></g>
      ${bubble('b1', 180, 240, 560, ['Confirmed. Noor gets', 'a text message —', 'no internet needed.'], 'right')}
      ${title('The tour company, Moshi', 'Juma confirms the request. WeKaribu turns it into a plain SMS.')}`,
    seek: t => {
      bob('juma', t); show('req', t, 0.8); talk('juma', t >= 3.0 && t < 6.5, t); show('b1', t, 2.9);
      const pressed = t > 2.3 && t < 2.7;
      $('confirmBtn').setAttribute('transform', pressed ? 'translate(1 1) scale(0.98)' : '');
      const u = clamp((t - 2.7) / 2.2);
      $('sms').setAttribute('opacity', t > 2.7 && u < 1 ? 1 : 0);
      $('sms').setAttribute('transform', `translate(${lerp(1140, 1800, ease(u))} ${lerp(470, 120, ease(u)) - Math.sin(u * Math.PI) * 160})`);
    },
  },
  farm_sms: {
    duration: 8,
    build: () => `
      <rect width="1920" height="1080" fill="${C.sky}"/>
      ${sun(300, 180)}${mountain}${hills}
      ${bush(260, 760, 1.2)}${bush(1700, 820, 1.1)}${bush(1480, 720, 0.8)}
      <g id="noorG" transform="translate(900 470)">${person('noor', { skin: '#7A4A2E', hair: '#1A1412', style: 'scarf', shirt: '#E2A85C', scarf: '#A33F2A' })}</g>
      <g id="phoneG" transform="translate(1040 560)">${basicPhone('bp', 0, 0)}</g>
      <g id="rings" opacity="0" fill="none" stroke="${C.brown}" stroke-width="6"><path d="M1150 560 q 30 30 0 60"/><path d="M1170 540 q 60 50 0 100"/></g>
      ${bubble('b1', 1180, 200, 640, ['WeKaribu: Wageni wapya.', 'Jumamosi: wageni 2 (Kiingereza),', 'mwongozaji Juma.'], 'left')}
      ${title('Noor’s farm, Materuni', 'Two guests on Saturday, English speakers. Noor knows a week ahead.')}`,
    seek: t => {
      bob('noor', t);
      const ring = t > 0.6 && t < 2.4 && Math.floor(t * 6) % 2 === 0;
      $('rings').setAttribute('opacity', ring ? 1 : 0);
      $('phoneG').setAttribute('transform', `translate(1040 560) rotate(${ring ? Math.sin(t * 60) * 4 : 0} 45 100)`);
      $('bp-txt').textContent = t > 2.4 ? 'SMS' : '';
      show('b1', t, 2.6);
      // Noor raises her arm to look at the phone, then smiles
      const a = ease(clamp((t - 1.8) / 0.6));
      $('noor-armR').setAttribute('transform', `translate(62 150) rotate(${-110 * a})`);
      smile('noor', t > 3.2);
      nod('noor', t, 4.4);
    },
  },
  visit: {
    duration: 9,
    build: () => `
      <rect width="1920" height="1080" fill="${C.sky}"/>
      ${sun(1620, 170)}${mountain}${hills}
      ${bush(140, 780, 1.1)}${bush(1780, 790, 1.0)}
      <!-- roasting pan with smoke -->
      <g transform="translate(900 700)"><ellipse rx="140" ry="40" fill="#3B2314"/><ellipse rx="150" ry="46" fill="none" stroke="#1A1412" stroke-width="10"/><g fill="#5B3A24">${[...Array(14)].map((_, i) => `<circle cx="${-100 + (i % 7) * 33}" cy="${-8 + Math.floor(i / 7) * 14}" r="9"/>`).join('')}</g></g>
      <g id="smoke" fill="none" stroke="#F6EFE6" stroke-width="10" stroke-linecap="round" opacity="0.6"><path id="sm1" d="M860 640 c -30 -60 30 -90 0 -150"/><path id="sm2" d="M940 630 c -30 -60 30 -90 0 -150"/></g>
      <g id="noorG" transform="translate(620 440)">${person('noor', { skin: '#7A4A2E', hair: '#1A1412', style: 'scarf', shirt: '#E2A85C', scarf: '#A33F2A' })}</g>
      <g id="vivianG" transform="translate(1180 450)">${person('vivian', { skin: '#F1C9A5', hair: '#B5651D', style: 'hat', shirt: '#2F7A8A' })}</g>
      <g id="frankG" transform="translate(1480 460)">${person('frank', { skin: '#E8B88E', hair: '#5A3A1E', style: 'short', shirt: '#A33F2A', beard: '#5A3A1E', glasses: true })}</g>
      <!-- guestbook on a small table -->
      <g id="book" transform="translate(1250 760)"><rect x="-150" y="0" width="300" height="20" rx="6" fill="#8C6B4F"/><rect x="-120" y="-70" width="240" height="70" rx="8" fill="#fff" stroke="#C9B8A4" stroke-width="4"/><path d="M0 -70 v 70" stroke="#C9B8A4" stroke-width="3"/><g id="ink" fill="none" stroke="#2B4A8A" stroke-width="3"><path id="ink1" d="M-100 -50 h 0"/><path id="ink2" d="M-100 -34 h 0"/><path id="ink3" d="M-100 -18 h 0"/></g></g>
      ${bubble('b1', 160, 120, 600, ['Karibu! Welcome!', 'First we roast,', 'then we grind.'], 'right')}
      ${title('Saturday at the farm', 'Vivian and Frank roast coffee with Noor’s family, and write in the paper guestbook.')}`,
    seek: t => {
      bob('noor', t); bob('vivian', t, 0.5); bob('frank', t, 0.9);
      talk('noor', t >= 0.8 && t < 4.0, t); show('b1', t, 0.6);
      for (let i = 1; i <= 2; i++) $('sm' + i).setAttribute('transform', `translate(${Math.sin(t * 1.5 + i) * 10} ${-((t * 30 + i * 40) % 80)})`);
      // writing in the guestbook after 5 s
      const w = clamp((t - 5.0) / 3.0);
      $('ink1').setAttribute('d', `M-100 -50 h ${200 * clamp(w * 3)}`);
      $('ink2').setAttribute('d', `M-100 -34 h ${200 * clamp(w * 3 - 1)}`);
      $('ink3').setAttribute('d', `M-100 -18 h ${140 * clamp(w * 3 - 2)}`);
      const a = ease(clamp((t - 4.6) / 0.5));
      $('vivian-armL').setAttribute('transform', `translate(-62 150) rotate(${60 * a})`);
      smile('vivian', t > 2); smile('frank', t > 2.5); smile('noor', t > 4.2);
    },
  },
  weekend: {
    duration: 9,
    build: () => `
      <rect width="1920" height="1080" fill="#EFE2D3"/>
      <rect x="0" y="720" width="1920" height="360" fill="#C9B8A4"/>
      <rect x="1200" y="120" width="420" height="380" rx="14" fill="#BFE0F5" stroke="#8C6B4F" stroke-width="14"/>${sun(1500, 230)}
      <rect x="300" y="620" width="900" height="36" rx="8" fill="#8C6B4F"/><rect x="340" y="656" width="30" height="300" fill="#8C6B4F"/><rect x="1130" y="656" width="30" height="300" fill="#8C6B4F"/>
      <g transform="translate(760 560)"><rect x="-120" y="-70" width="240" height="70" rx="8" fill="#fff" stroke="#C9B8A4" stroke-width="4"/><path d="M0 -70 v 70" stroke="#C9B8A4" stroke-width="3"/><g fill="none" stroke="#2B4A8A" stroke-width="3"><path d="M-100 -50 h 200"/><path d="M-100 -34 h 200"/><path d="M-100 -18 h 140"/></g></g>
      <g id="noorG" transform="translate(430 400)">${person('noor', { skin: '#7A4A2E', hair: '#1A1412', style: 'scarf', shirt: '#E2A85C', scarf: '#A33F2A' })}</g>
      <g id="aminaG" transform="translate(1100 410)">${person('amina', { skin: '#8D5A3C', hair: '#1A1412', style: 'braids', shirt: '#2F7A8A' })}</g>
      <g id="aminaPhone" opacity="0">${phoneSvg('ap', 0, 0, 110, 200, `<rect x="14" y="54" width="82" height="60" rx="6" fill="#DCE8CF"/><text x="55" y="92" text-anchor="middle" font-size="26">📷</text>`)}</g>
      <g id="flash" opacity="0"><rect width="1920" height="1080" fill="#fff"/></g>
      <!-- data flow icons -->
      <g id="flow" opacity="0">
        <g id="f1"><rect x="0" y="0" width="120" height="80" rx="12" fill="#fff" stroke="${C.brown}" stroke-width="4"/><text x="60" y="52" text-anchor="middle" font-size="34" font-weight="800" fill="${C.brown}">Aa</text></g>
        <g id="f2"><rect x="0" y="0" width="120" height="80" rx="12" fill="#fff" stroke="${C.brown}" stroke-width="4"/><text x="60" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="${C.brown}">EN→SW</text></g>
        <g id="f3"><rect x="0" y="0" width="120" height="80" rx="12" fill="#fff" stroke="${C.brown}" stroke-width="4"/><rect x="22" y="44" width="16" height="22" fill="${C.leaf}"/><rect x="46" y="28" width="16" height="38" fill="${C.leaf}"/><rect x="70" y="16" width="16" height="50" fill="${C.cherry}"/></g>
      </g>
      <!-- tourism office -->
      <g id="officeIcon" transform="translate(1660 560)" opacity="0.95"><rect x="0" y="0" width="200" height="150" rx="10" fill="#D9E6EF" stroke="#2F5A78" stroke-width="6"/><rect x="20" y="30" width="40" height="40" fill="#fff"/><rect x="80" y="30" width="40" height="40" fill="#fff"/><rect x="140" y="30" width="40" height="40" fill="#fff"/><rect x="80" y="100" width="40" height="50" fill="#2F5A78"/><text x="100" y="-14" text-anchor="middle" font-size="22" font-weight="700" fill="#2F5A78">Tourism office</text></g>
      ${bubble('b1', 1180, 160, 560, ['Mama, ten minutes:', 'the whole week,', 'in Swahili.'], 'left')}
      ${title('Sunday: Amina comes home', 'The helper photographs the guestbook. The phone reads, translates and sorts it, offline.')}`,
    seek: t => {
      bob('noor', t); bob('amina', t, 0.6);
      // amina walks in from the right
      const walk = ease(clamp(t / 1.6));
      $('aminaG').setAttribute('transform', `translate(${lerp(1700, 1100, walk)} ${410 + Math.abs(Math.sin(t * 9)) * (1 - walk) * 10})`);
      $('aminaPhone').setAttribute('opacity', t > 1.8 ? 1 : 0);
      $('aminaPhone').setAttribute('transform', `translate(${lerp(1150, 1000, ease(clamp((t - 1.8) / 0.6)))} ${lerp(560, 440, ease(clamp((t - 1.8) / 0.6)))}) rotate(-20)`);
      $('amina-armL').setAttribute('transform', `translate(-62 150) rotate(${90 * ease(clamp((t - 1.8) / 0.6))})`);
      $('flash').setAttribute('opacity', t > 2.6 && t < 2.75 ? 0.8 : 0);
      const u = clamp((t - 2.9) / 3.5);
      $('flow').setAttribute('opacity', u > 0 && u < 1 ? 1 : 0);
      $('f1').setAttribute('transform', `translate(${lerp(760, 1660, ease(clamp(u * 1.6)))} ${lerp(440, 520, ease(clamp(u * 1.6))) - Math.sin(clamp(u * 1.6) * Math.PI) * 120})`);
      $('f2').setAttribute('transform', `translate(${lerp(760, 1660, ease(clamp(u * 1.6 - 0.3)))} ${lerp(440, 520, ease(clamp(u * 1.6 - 0.3))) - Math.sin(clamp(u * 1.6 - 0.3) * Math.PI) * 160})`);
      $('f3').setAttribute('transform', `translate(${lerp(760, 1660, ease(clamp(u * 1.6 - 0.6)))} ${lerp(440, 520, ease(clamp(u * 1.6 - 0.6))) - Math.sin(clamp(u * 1.6 - 0.6) * Math.PI) * 200})`);
      talk('amina', t >= 5.5 && t < 8.5, t); show('b1', t, 5.4); smile('noor', t > 6.5);
    },
  },
  outro: {
    duration: 7,
    build: () => `
      <rect width="1920" height="1080" fill="#3B2618"/>
      <g id="stars" fill="#F6EFE6" opacity="0.8"><circle cx="180" cy="140" r="3"/><circle cx="420" cy="260" r="2"/><circle cx="760" cy="90" r="2.5"/><circle cx="1240" cy="160" r="2"/><circle cx="1500" cy="320" r="3"/><circle cx="1720" cy="110" r="2"/></g>
      <g transform="translate(1740 130)"><circle r="60" fill="#F6EFE6"/><circle cx="30" cy="-16" r="53" fill="#2C1B10"/></g>
      <g id="title" opacity="0"><text x="960" y="300" text-anchor="middle" font-size="150" font-weight="800" fill="#F6EFE6">WeKaribu</text><text x="960" y="380" text-anchor="middle" font-size="46" fill="#EADDCB">we welcome · any host · any guest language · no account</text></g>
      <g id="links" opacity="0"><text x="960" y="620" text-anchor="middle" font-size="54" font-weight="700" fill="#E2A85C">wekaribu.lovable.app</text><text x="960" y="690" text-anchor="middle" font-size="34" fill="#DECCB8">github.com/Tristazxy/kitabu-gateway</text></g>
      <g id="credits" opacity="0"><text x="960" y="780" text-anchor="middle" font-size="30" fill="#B09680">Built by Trista Zhang for Hack-Nation × World Bank “Small AI for Development”. Guests, hosts and places are invented.</text></g>
      <g id="korla" transform="translate(230 900)"><g transform="scale(0.7)">
        <g transform="translate(-170 -60)"><circle r="92" fill="#8A9098"/><circle r="60" fill="#E9C9D0"/></g><g transform="translate(170 -60)"><circle r="92" fill="#8A9098"/><circle r="60" fill="#E9C9D0"/></g>
        <circle r="170" fill="#9AA0A8"/><ellipse cx="0" cy="40" rx="118" ry="96" fill="#B9BEC5"/>
        <circle cx="-57" cy="-22" r="26" fill="#fff"/><circle cx="57" cy="-22" r="26" fill="#fff"/><circle cx="-52" cy="-18" r="14" fill="#2B1D14"/><circle cx="62" cy="-18" r="14" fill="#2B1D14"/>
        <ellipse cx="0" cy="38" rx="44" ry="56" fill="#2B1D14"/><path d="M-36 112 q 36 34 72 0" fill="none" stroke="#2B1D14" stroke-width="8" stroke-linecap="round"/>
        <g id="wave" transform="translate(230 60)"><circle r="44" fill="#9AA0A8" stroke="#6E747C" stroke-width="6"/></g>
      </g></g>`,
    seek: t => {
      $('title').setAttribute('opacity', clamp(t / 0.6)); $('title').setAttribute('transform', `translate(0 ${(1 - ease(clamp(t / 0.6))) * 40})`);
      $('links').setAttribute('opacity', clamp((t - 1.2) / 0.6));
      $('credits').setAttribute('opacity', clamp((t - 2.2) / 0.6));
      $('wave').setAttribute('transform', `translate(230 ${60 + Math.sin(t * 6) * 18})`);
      $('korla').setAttribute('transform', `translate(230 ${900 + Math.sin(t * 2) * 6})`);
    },
  },
};

// ---------- animation helpers ----------
function bob(id, t, phase = 0) {
  const g = $(id + '-head'); if (g) g.setAttribute('transform', `translate(0 ${Math.sin(t * 2.4 + phase) * 4}) rotate(${Math.sin(t * 1.3 + phase) * 2})`);
  const e = $(id + '-eyes'); if (e) { const blink = ((t + phase) % 3.1) < 0.12; e.setAttribute('transform', blink ? 'translate(0 -4) scale(1 0.1)' : ''); }
}
function talk(id, on, t) {
  const m = $(id + '-mouth'); if (!m) return;
  if (on) { m.setAttribute('ry', 4 + Math.abs(Math.sin(t * 14)) * 9); m.setAttribute('rx', 12 + Math.abs(Math.sin(t * 9)) * 4); m.setAttribute('fill', '#5B2A2A'); }
  else { m.setAttribute('ry', 4); m.setAttribute('rx', 12); m.setAttribute('fill', C.ink); }
}
function smile(id, on) {
  const m = $(id + '-mouth'); if (!m) return;
  if (on) { m.setAttribute('rx', 18); m.setAttribute('ry', 5); m.setAttribute('cy', 32); }
}
function nod(id, t, at) {
  const g = $(id + '-head'); if (!g) return;
  if (t > at && t < at + 0.9) g.setAttribute('transform', `translate(0 ${Math.sin((t - at) * 7) * 8})`);
}
function show(id, t, at, fade = 0.3) { const e = $(id); if (e) e.setAttribute('opacity', clamp((t - at) / fade)); }

let current = null;
window.SCENES = Object.fromEntries(Object.entries(SCENES).map(([k, v]) => [k, v.duration]));
window.setScene = id => {
  current = SCENES[id];
  $('stage').innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${current.build()}</svg>`;
  window.seek(0);
};
window.seek = t => { if (current) current.seek(clamp(t, 0, current.duration)); };
window.setScene('kitchen');
</script>
