<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WeKaribu</title>
  <meta name="description" content="WeKaribu: guests write in their language, the host hears it in hers. Works offline, no sign-up.">
  <meta name="theme-color" content="#1F4D3A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script type="module" crossorigin src="./assets/main-DIxux_Kk.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/ui-vkyC1weZ.js">
  <link rel="stylesheet" crossorigin href="./assets/ui-RQwt5RVm.css">
</head>
<body>
  <div id="nature" class="nature" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">WeKaribu</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn net-btn" id="net-btn" data-action="toggle-net" aria-pressed="false" aria-live="polite"><span class="dot"></span>Online</button>
      <button class="icon-btn" id="motion-btn" data-action="toggle-motion" aria-pressed="false" aria-label="Stop the moving background"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="3.5" height="10" rx="1" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="10" rx="1" fill="currentColor"/></svg><span class="btn-word"> Video</span></button>
      <label class="lang-pick" aria-label="Lugha / Language"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="ui-lang" data-change="ui-lang"><option value="sw">Kiswahili</option><option value="en">English</option></select></label>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Tafadhali washa JavaScript. Please enable JavaScript.</noscript>
</body>
</html>
